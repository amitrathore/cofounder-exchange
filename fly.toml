app = "cofounder-exchange"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  BASE_URL = "https://cofounder.exchange"
  DATABASE_PATH = "/data/cofounder-exchange.sqlite"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[mounts]]
  source = "cofounder_exchange_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 7

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
